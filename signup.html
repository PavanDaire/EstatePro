<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create an account | SequreHomes</title>
    <link rel="stylesheet" href="css/login.css">
</head>
<body>
  
  
    <div class="wrapper">
        <h1 class="title">Create an account</h1>
        <form id="signup-form">
            <div class="field">
                <input id="name" name="name" type="text" autocomplete="name" required>
                <label for="name">Full name</label>
            </div>
            <div class="field">
                <input id="email" name="email" type="email" autocomplete="email" required>
                <label for="email">Email address</label>
            </div>
            <div class="field">
                <input id="password" name="password" type="password" autocomplete="new-password" minlength="6" required>
                <label for="password">Password</label>
                <button class="password-toggle" type="button" aria-label="Show password" aria-controls="password" data-password-toggle>
                    <svg data-eye-open viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                        <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"></path>
                        <circle cx="12" cy="12" r="3"></circle>
                    </svg>
                    <svg data-eye-closed viewBox="0 0 24 24" aria-hidden="true" focusable="false" hidden>
                        <path d="m3 3 18 18M10.6 10.6a2 2 0 0 0 2.8 2.8"></path>
                        <path d="M9.9 5.2A10.8 10.8 0 0 1 12 5c6.4 0 10 7 10 7a15.8 15.8 0 0 1-3.1 3.8M6.2 6.2C3.5 8.1 2 12 2 12s3.6 7 10 7a10 10 0 0 0 4.2-.9"></path>
                    </svg>
                </button>
            </div>
            <div class="field">
                <input id="confirm-password" name="confirm-password" type="password" autocomplete="new-password" minlength="6" required>
                <label for="confirm-password">Confirm password</label>
                <button class="password-toggle" type="button" aria-label="Show password" aria-controls="confirm-password" data-password-toggle>
                    <svg data-eye-open viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                        <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"></path>
                        <circle cx="12" cy="12" r="3"></circle>
                    </svg>
                    <svg data-eye-closed viewBox="0 0 24 24" aria-hidden="true" focusable="false" hidden>
                        <path d="m3 3 18 18M10.6 10.6a2 2 0 0 0 2.8 2.8"></path>
                        <path d="M9.9 5.2A10.8 10.8 0 0 1 12 5c6.4 0 10 7 10 7a15.8 15.8 0 0 1-3.1 3.8M6.2 6.2C3.5 8.1 2 12 2 12s3.6 7 10 7a10 10 0 0 0 4.2-.9"></path>
                    </svg>
                </button>
            </div>
            <div class="field">
                <input id="signup-submit" type="submit" value="Signup">
            </div>
            <p class="form-message" id="signup-message" role="status" aria-live="polite" hidden></p>
            <div class="signup-link">Already a member? <a href="login.html">Login now</a></div>
        </form>
    </div>
    <dialog class="signup-dialog" id="signup-dialog" aria-labelledby="signup-dialog-title" aria-describedby="signup-dialog-message">
        <div class="signup-dialog-content">
            <h2 id="signup-dialog-title">Account created</h2>
            <p id="signup-dialog-message">Your account is ready. Please log in now to continue.</p>
            <div class="signup-dialog-actions">
                <button class="dialog-dismiss" id="signup-dialog-dismiss" type="button">Close</button>
                <a class="dialog-login" href="login.html">Login now</a>
            </div>
        </div>
    </dialog>
    <script type="module" src="js/signup.js"></script>
    <script type="module" src="js/password-toggle.js"></script>
</body>
</html>
