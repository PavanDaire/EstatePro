<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log in | SequreHomes</title>
    <link rel="stylesheet" href="css/login.css">
</head>
<body>
   
    <div class="wrapper">
        <h1 class="title">Log in</h1>
        <form id="login-form">
            <div class="field">
                <input id="email" name="email" type="email" autocomplete="username" required>
                <label for="email">Email address</label>
            </div>
            <div class="field">
                <input id="password" name="password" type="password" autocomplete="current-password" required>
                <label for="password">Password</label>
                <button class="password-toggle" type="button" aria-label="Show password" aria-controls="password" data-password-toggle>
                    <svg data-eye-open viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                        <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"></path>
                        <circle cx="12" cy="12" r="3"></circle>
                    </svg>
                    <svg data-eye-closed viewBox="0 0 24 24" aria-hidden="true" focusable="false" hidden>
                        <path d="m3 3 18 18M10.6 10.6a2 2 0 0 0 2.8 2.8"></path>
                        <path d="M9.9 5.2A10.8 10.8 0 0 1 12 5c6.4 0 10 7 10 7a15.8 15.8 0 0 1-3.1 3.8M6.2 6.2C3.5 8.1 2 12 2 12s3.6 7 10 7a10 10 0 0 0 4.2-.9"></path>
                    </svg>
                </button>
            </div>
            <div class="content">
                <div class="checkbox">
                    <input type="checkbox" id="remember-me" checked>
                    <label for="remember-me">Remember me</label>
                </div>
                <div class="pass-link"><a href="forget.html">Forgot password?</a></div>
            </div>
            <div class="field">
                <input id="login-submit" type="submit" value="Login">
            </div>
            <p class="form-message" id="login-message" role="status" aria-live="polite" hidden></p>
            <div class="signup-link">Not a member? <a href="signup.html">Signup now</a></div>
        </form>
    </div>
    <script type="module" src="js/login.js"></script>
    <script type="module" src="js/password-toggle.js"></script>
</body>
</html>
